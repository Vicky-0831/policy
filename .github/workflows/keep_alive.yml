name: 24h全天候硬核保活

on:
  schedule:
    - cron: '0 */4 * * *' # 每 4 小时唤醒一次，不需要太频繁
  workflow_dispatch:

jobs:
  ping_app:
    runs-on: ubuntu-latest
    steps:
      - name: 运行自动化唤醒脚本
        run: |
          # 安装 Playwright 自动化浏览器
          pip install playwright
          playwright install chromium
          
          # 执行 Python 脚本模拟真人访问
          python -c "
          from playwright.sync_api import sync_playwright
          import time

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              print('正在尝试唤醒应用...')
              # 替换成你的应用链接
              page.goto('https://policy-vk.streamlit.app/') 
              time.sleep(15) # 等待 15 秒确保 JS 加载完成
              print('访问成功，页面标题为:', page.title())
              browser.close()
          " || exit 0 # 即使失败也不发邮件报警
